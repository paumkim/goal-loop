name: check

on:
  push:
    branches: [dev, main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # docs:check derives stamps and the 30-row changelog from git log; a depth-1 clone makes every page look stale
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          # pin the bun the dist byte-compare gate was verified with; a floating bun can break "dist is in sync" spuriously
          bun-version: 1.4.2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck, test, compile
        run: bun run check
      - name: Pack smoke test
        run: npm pack --dry-run
      - name: dist is in sync with src
        run: bun run compile && git diff --exit-code -- dist/
